{% extends "base.html" %}
{% load static %}

{% block title %}CardioQuant{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[75vh] text-center px-4">
    
    <h1 class="text-6xl md:text-8xl font-black text-base-content mb-6 tracking-tight">
        CardioQuant
    </h1>
    
    <p class="text-lg md:text-2xl text-base-content/70 mb-10 max-w-3xl">
        Calculate the area under the curve of your datasets, maximizing server-side performance.
    </p>
    
    <a href="{% url 'calculator:index' %}" class="btn btn-primary btn-lg btn-wide shadow-xl text-base-200">
        Start to calculate
    </a>

</div>
{% endblock %}
