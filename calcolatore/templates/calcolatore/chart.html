<!-- Contenitore del grafico stile DaisyUI -->
<div class="overflow-x-auto rounded-box border border-base-content/10 bg-base-200 mt-3">
    <div class="flex justify-center items-center p-6">
        <div id="mioGraficoLineare" class="w-auto aspect-video h-80"></div>
        <span class="font-bold text-3xl inline">$$I_R \approx h \sum_{i=0}^{n-1} y_i$$</span>
        <span class="font-bold text-3xl">=</span>
        <span class="font-bold text-3xl">{{ result }}</span>
    </div>
</div>


<!-- Script per l'inizializzazione del grafico -->
<script>
  (function() {
      // 1. Recupera i dati passati da Django
      const rectsData = JSON.parse('{{ rects|safe }}');
      const curve = {{ curve|safe }};

      // Seleziona l'elemento DOM
      const chartDom = document.getElementById('mioGraficoLineare');

      // 2. PASSAGGIO FONDAMENTALE PER HTMX
      // Controlla se ECharts è già stato inizializzato su questo div e distruggilo
      let graficoEsistente = echarts.getInstanceByDom(chartDom);
      if (graficoEsistente) {
          echarts.dispose(graficoEsistente);
      }

      // 3. Inizializza il nuovo grafico
      const myChart = echarts.init(chartDom);

      // 4. Configurazione stile ECharts
      const option = {
        grid: { top: 24, right: 16, bottom: 44, left: 52 },
        xAxis: {
          type: 'value',
          name: 'Tempo (s)',
          nameLocation: 'middle',
          nameGap: 30,
          axisLabel: { formatter: v => v.toFixed(2) }
        },
        yAxis: {
          type: 'value',
          name: 'Tensione (mV)',
          nameLocation: 'middle',
          nameGap: 42
        },

        series: [
          // 1. Rettangoli
          {
            type: 'custom',
            z: 2,
            data: rectsData,
            renderItem(params, api) {
              const xStart  = api.value(0);
              const xEnd    = api.value(1);
              const height  = api.value(2);

              const topLeft     = api.coord([xStart, height]);
              const bottomRight = api.coord([xEnd, 0]);

              return {
                type: 'rect',
                shape: {
                  x:      topLeft[0],
                  y:      topLeft[1],
                  width:  bottomRight[0] - topLeft[0],
                  height: bottomRight[1] - topLeft[1]
                },
                style: {
                  fill:      'rgba(52, 152, 219, 0.22)',
                  stroke:    'rgba(52, 152, 219, 0.75)',
                  lineWidth: 1.3
                }
              };
            }
          },

          // 2. Curva ECG
          {
            type: 'line',
            z: 10,
            data: curve,
            symbol: 'circle',
            symbolSize: 6,
            lineStyle: { color: '#5e81ac', width: 2 },
            itemStyle: { color: '#5e81ac' }
          }
        ]
      };

      // Applica la configurazione
      myChart.setOption(option);

      // 5. Rendi il grafico responsivo
      // Poiché Tailwind usa il flexbox/grid, assicuriamoci che ECharts si adatti se la finestra cambia dimensione
      window.addEventListener('resize', function() {
          myChart.resize();
      });
  })();
</script>
