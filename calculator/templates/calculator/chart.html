<!-- Contenitore del grafico stile DaisyUI -->
<div class="overflow-x-auto rounded-box border border-base-content/10 bg-base-200 mt-3">
    <div class="flex justify-center items-center p-6">
        {% if calc_id %}
            <div id="chart-{{ calc_id }}" class="w-auto aspect-video h-80"></div>
            <span class="font-bold text-2xl inline" id="formula-{{ calc_id }}">$$I_R \approx h \sum_{i=0}^{n-1} y_i$$</span>
            <span class="font-bold text-2xl">=</span>
            <span class="font-bold text-2xl" id="result-{{ calc_id }}"></span>
            <span class="font-bold text-2xl">mV·s</span>
        {% else %}
            <div id="chart" class="w-auto aspect-video h-80"></div>
            <span class="font-bold text-2xl inline" id="formula">$$I_R \approx h \sum_{i=0}^{n-1} y_i$$</span>
            <span class="font-bold text-2xl">=</span>
            <span class="font-bold text-2xl" id="result"></span>
            <span class="font-bold text-2xl">mV·s</span>
        {% endif %}
    </div>
</div>


<!-- Script per l'inizializzazione del grafico -->
<script>
  (function() {
      // 1. Recupera i dati passati da Django
      const rects = JSON.parse('{{ rects|safe }}');
      const traps = JSON.parse('{{ trapezius|safe }}');
      const simpson = JSON.parse('{{ simpson|safe }}');
      const curve = {{ curve|safe }};
      const formula = {
          Rectangles: "$$I_R \\approx h \\sum_{i=0}^{n-1} y_i$$",
          Trapezius: "$$I_T \\approx \\frac{h}{2} \\left[ y_0 + 2 \\sum_{i=1}^{n-1} y_i + y_n \\right]$$",
          Simpson: "$$I_S \\approx \\frac{h}{3} \\left[ y_0 + 4 \\sum_{\\text{odd}} y_i + 2 \\sum_{\\text{even}} y_i + y_n \\right]$$"
      };
      const integrals = {
          Rectangles: {{ rects_result }},
          Trapezius: {{ trapezius_result }},
          Simpson: {{ simpson_result }}
      };

      // Seleziona l'elemento DOM
      {% if calc_id %}
          const chartDom  = document.getElementById('chart-{{ calc_id }}');
          const formulaEl = document.getElementById('formula-{{ calc_id }}');
          const resultEl  = document.getElementById('result-{{ calc_id }}');
      {% else %}
          const chartDom = document.getElementById('chart');
          const formulaEl = document.getElementById('formula');
          const resultEl = document.getElementById('result');
      {% endif %}



      // 2. PASSAGGIO FONDAMENTALE PER HTMX
      // Controlla se ECharts è già stato inizializzato su questo div e distruggilo
      let graficoEsistente = echarts.getInstanceByDom(chartDom);
      if (graficoEsistente) {
          echarts.dispose(graficoEsistente);
      }

      // 3. Inizializza il nuovo grafico
      const myChart = echarts.init(chartDom);

      // 4. Configurazione stile ECharts
      const option = {
        grid: { top: 24, right: 16, bottom: 44, left: 52 },
        xAxis: {
          type: 'value',
          name: 'Tempo (s)',
          nameLocation: 'middle',
          nameGap: 30,
          axisLabel: { formatter: v => v.toFixed(2) }
        },
        yAxis: {
          type: 'value',
          name: 'Tensione (mV)',
          nameLocation: 'middle',
          nameGap: 42
        },

        series: [
          // 1. Rettangoli
          { type: 'custom', id: 'shapes', z: 2, data: [], renderItem: renderRect },

          // 2. Curva ECG
          {
            type: 'line',
            smooth: true,
            id: 'curve',
            z: 10,
            data: curve,
            symbol: 'circle',
            symbolSize: 6,
            lineStyle: { color: '#5e81ac', width: 2 },
            itemStyle: { color: '#5e81ac' }
          }
        ]
      };

      // Applica la configurazione
      myChart.setOption(option);

        // --- renderItem per rettangoli ---
      function renderRect(params, api) {
        const tl = api.coord([api.value(0), api.value(2)]);
        const br = api.coord([api.value(1), 0]);
        return {
          type: 'rect',
          shape: { x: tl[0], y: tl[1], width: br[0] - tl[0], height: br[1] - tl[1] },
          style: { fill: 'rgba(52,152,219,0.22)', stroke: 'rgba(52,152,219,0.75)', lineWidth: 1.3 }
        };
      }

      function renderTrap(params, api) {
        return {
          type: 'polygon',
          shape: {
            points: [
              api.coord([api.value(0), 0]),           // basso sinistra
              api.coord([api.value(0), api.value(2)]), // alto sinistra
              api.coord([api.value(1), api.value(3)]), // alto destra
              api.coord([api.value(1), 0]),            // basso destra
            ]
          },
          style: { fill: 'rgba(39,174,96,0.22)', stroke: 'rgba(39,174,96,0.75)', lineWidth: 1.3 }
        };
      }

      function renderSimpson(params, api) {
          const x0 = api.value(0), x1 = api.value(1), x2 = api.value(2);
          const y0 = api.value(3), y1 = api.value(4), y2 = api.value(5);

          const bl = api.coord([x0, 0]);       // basso sinistra
          const tl = api.coord([x0, y0]);      // alto  sinistra
          const tr = api.coord([x2, y2]);      // alto  destra
          const br = api.coord([x2, 0]);       // basso destra

          // Punto di controllo Bezier: forza la curva a passare per (x1, y1)
          const cp = api.coord([x1, 2 * y1 - (y0 + y2) / 2]);

          return {
            type: 'path',
            shape: {
              pathData: `M ${bl[0]} ${bl[1]}
                         L ${tl[0]} ${tl[1]}
                         Q ${cp[0]} ${cp[1]} ${tr[0]} ${tr[1]}
                         L ${br[0]} ${br[1]} Z`
            },
            style: {
              fill:      'rgb(226 203 89 / 0.22)',
              stroke:    'rgb(212 188 65 / 0.75)',
              lineWidth: 1.3
            }
          };
        }

      // --- Cambio metodo ---
      function setMethod(method) {
        const config = {
            Rectangles: { data: rects, renderItem: renderRect },
            Trapezius:  { data: traps, renderItem: renderTrap },
            Simpson:    { data: simpson, renderItem: renderSimpson },
        };
        myChart.setOption({
          series: [{ id: 'shapes', ...config[method] }]
        });
        formulaEl.textContent = formula[method];
        resultEl.textContent = integrals[method].toFixed(4);
        window.MathJax.typesetPromise();
      }

      setMethod('{{ requested_method }}');

      {% if calc_id %}
          document.getElementById('rect-button-{{ calc_id }}').addEventListener('click', () => setMethod('Rectangles'));
          document.getElementById('trap-button-{{ calc_id }}').addEventListener('click', () => setMethod('Trapezius'));
          document.getElementById('simpson-button-{{ calc_id }}').addEventListener('click', () => setMethod('Simpson'));
      {% else %}
          document.getElementById('rect-button').addEventListener('click', () => setMethod('Rectangles'));
          document.getElementById('trap-button').addEventListener('click', () => setMethod('Trapezius'));
          document.getElementById('simpson-button').addEventListener('click', () => setMethod('Simpson'));
      {% endif %}
      // 5. Rendi il grafico responsivo
      // Poiché Tailwind usa il flexbox/grid, assicuriamoci che ECharts si adatti se la finestra cambia dimensione
      window.addEventListener('resize', () => myChart.resize());
  })();
</script>
